#
# https://github.com/P3TERX/Actions-OpenWrt
# File: .github/workflows/openwrt-builder.yml
# Description: 构建 NRadio C8（WT9104 / C8-688）固件
#
name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  # immutable 最新发行版 tag（可复现；openwrt-25.12 分支的发行点）
  BUILD_BRANCH: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  EMAIL: johnny@nexwy.me
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.BUILD_BRANCH }}-${{ hashFiles('.config') }}
        restore-keys: |
          ccache-${{ env.BUILD_BRANCH }}-

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install tar ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libev-dev libtirpc-dev liblzma-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git config --global user.name $GITHUB_ACTOR
        git config --global user.email $EMAIL
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout $BUILD_BRANCH
        echo "immortalwrt commit: $(git rev-parse HEAD)"
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # ---- 诊断：本地包为什么没进 .config ----
        echo "==== 诊断 ===="
        echo "--- 本地包安装位置（feeds/nrlocal 或 package/）---"
        ls -d package/feeds/nrlocal/*/ 2>/dev/null | head -5
        ls -d package/luci-app-* 2>/dev/null | head -5 || true
        echo "--- 探针：直接 dump 该包的元数据（看 Package 定义是否存在）---"
        ( cd package/feeds/nrlocal/luci-app-wtmodem 2>/dev/null || cd package/luci-app-wtmodem 2>/dev/null ) && {
          make -pn -f Makefile > /tmp/db.txt 2>/tmp/db.err; echo "    make -pn rc=$?"
          sed -n '1,8p' /tmp/db.err | sed 's/^/    stderr: /'
          printf '    Package/luci-app-wtmodem 定义数: '; grep -c "^Package/luci-app-wtmodem" /tmp/db.txt || true
          printf '    DEPENDS:            '; grep -m1 "^DEPENDS" /tmp/db.txt || true
          printf '    PKG_NAME:           '; grep -m1 "^PKG_NAME" /tmp/db.txt || true
        }
        echo "--- package/luci-app-wtmodem 内容 ---"
        ls -la package/luci-app-wtmodem 2>&1 | head -10
        echo "--- 包目录文件列表缓存 tmp/.packagedirs ---"
        if [ -f tmp/.packagedirs ]; then
          wc -l < tmp/.packagedirs | sed 's/^/  总条目: /'
          grep -cE "package/luci-app-(wtmodem|cellscan)/Makefile" tmp/.packagedirs \
            || echo "  !! 我们的包不在文件列表里（就是它导致扫描不到）"
        else
          echo "  tmp/.packagedirs 不存在"
        fi
        echo "--- 生成的 Kconfig 里是否注册了符号 ---"
        for p in luci-app-wtmodem luci-app-cellscan; do
          printf '  %s: ' "$p"
          if [ -f tmp/.config-package.in ]; then
            grep -c "config PACKAGE_$p$" tmp/.config-package.in 2>/dev/null || echo 0
          else
            echo 'tmp/.config-package.in 不存在'
          fi
        done
        echo "--- .config 里是否有残留 ---"
        grep -nE 'luci-app-(wtmodem|cellscan)' .config | head -5 || echo '  (无)'
        echo "==== 诊断结束 ===="
        # 快速失败：确认本仓库自带的本地包真的被 defconfig 选中了。
        # 否则要等 2.5 小时才在编译末尾报“找不到包/依赖缺失”，代价太大。
        missing=0
        for p in luci-app-wtmodem luci-app-cellscan luci-compat luci-lua-runtime luci-lib-nixio; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "  OK   CONFIG_PACKAGE_$p=y"
          else
            echo "::error::CONFIG_PACKAGE_$p 未被选中（本地包没拷进 package/？依赖缺失？）"
            grep -n "$p" .config | head -5 || true
            missing=1
          fi
        done
        [ "$missing" = 0 ] || exit 1
        grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        grep -q '^CONFIG_CCACHE=y' .config && echo "ccache enabled: $(ccache -s | head -3)"
        if make -j$(nproc) || make -j1 || make -j1 V=s; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "::error::编译失败，不会上传/发布产物"
          exit 1
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "device: NRadio C8 (WT9104 / C8-688), target: mediatek/filogic" >> release.txt
        echo "base: immortalwrt @ $BUILD_BRANCH" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      continue-on-error: true
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
