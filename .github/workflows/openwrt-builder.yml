#
# https://github.com/P3TERX/Actions-OpenWrt
# File: .github/workflows/openwrt-builder.yml
# Description: 构建 NRadio C8（WT9104 / C8-688）固件
#
name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  # immutable 最新发行版 tag（可复现；openwrt-25.12 分支的发行点）
  BUILD_BRANCH: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  EMAIL: johnny@nexwy.me
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.BUILD_BRANCH }}-${{ hashFiles('.config') }}
        restore-keys: |
          ccache-${{ env.BUILD_BRANCH }}-

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install tar ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libev-dev libtirpc-dev liblzma-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git config --global user.name $GITHUB_ACTOR
        git config --global user.email $EMAIL
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout $BUILD_BRANCH
        echo "immortalwrt commit: $(git rev-parse HEAD)"
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration (files / .config / patches / local packages)
      run: |
        # 说明：原先这里调用的 diy-part2.sh 已内联到本步骤（2026-10-03），
        #       逻辑逐行等价，只是不再需要 chmod +x 和跨文件跳转。
        #       默认 LAN IP / 主机名 / 时区统一交给 files/etc/uci-defaults/99-nradio-c8-defaults，
        #       所以不需要在本步骤 sed config_generate。
        OPENWRT="$GITHUB_WORKSPACE/openwrt"
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config

        # ---- 1. 应用机型补丁（NRadio C8 / WT9104）----
        # 补丁是 git 可 diff 的文本（见 docs/RFC-nradio-c8-native-firmware.md §5.2）。
        # git apply 失败必须立即中断：不允许带着“半个补丁”往下跑 2.5 小时。
        for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
          [ -e "$p" ] || continue
          echo "applying $(basename "$p")"
          git -C "$OPENWRT" apply --verbose "$p"
        done
        echo "--- 已应用补丁后的改动（预期只在 target/linux/mediatek 下）---"
        git -C "$OPENWRT" diff --stat

        # ---- 2. 确认本地包真的就位（早点报错，别等 2.5 小时）----
        # diy-part1.sh 用 `src-link nrlocal $GITHUB_WORKSPACE/packages` 注册了 feed，
        # feeds install 之后包应出现在 package/feeds/nrlocal/<name>（通常是指回
        # $GITHUB_WORKSPACE/packages/<category>/<name> 的软链）。
        for p in "$GITHUB_WORKSPACE"/packages/*/*/; do
          [ -d "$p" ] || continue
          name=$(basename "$p")
          found=""
          for cand in "$OPENWRT/package/feeds/nrlocal/$name" "$OPENWRT/package/$name"; do
            [ -f "$cand/Makefile" ] && found=$cand && break
          done
          if [ -z "$found" ]; then
            echo "错误：本地包 $name 没出现在 openwrt/package/{feeds/nrlocal/,} 下" >&2
            ls -la "$OPENWRT/package/feeds/" 2>/dev/null | head >&2
            exit 1
          fi
          echo "local package ok: $name -> ${found#$OPENWRT/}"
        done

        # ---- 3. 清包元数据 / 包目录缓存 ----
        # .packagedirs 是「包目录文件列表」缓存；如果它是在本地包拷进来之前生成的，
        # 扫描阶段就永远看不到我们的包（连一个警告都没有，症状就是 config 符号缺失）。
        # 本地包是在上面 Update/Install feeds 阶段才进包的，本步骤紧接其后，
        # 缓存很可能仍是 feeds 更新前那份 —— 所以这一步不能省。
        # （实测踩过：luci-app-wtmodem / luci-app-cellscan 被 defconfig 静默丢掉。）
        rm -f "$OPENWRT/tmp/.packageinfo" "$OPENWRT/tmp/.config-package.in" \
              "$OPENWRT/tmp/.targetinfo" "$OPENWRT/tmp/.config-target.in" \
              "$OPENWRT/tmp/.packagedirs" "$OPENWRT/tmp/.packagedirs.tmp" \
              "$OPENWRT/tmp/.targetdirs" "$OPENWRT/tmp/.targetinfo.tmp"
        echo "已清理 tmp/ 包元数据与包目录缓存（下次 make defconfig 会重新扫描）"

        # ---- 4. files/ 卫生 ----
        # `mv files openwrt/files` 会把目录里**所有**文件（含 .gitignore 掉的）一起带进
        # rootfs。本地调试留下的 python 缓存会因此混进固件，清掉（纯增重，无用处）。
        if [ -d "$OPENWRT/files" ]; then
          n=$(find "$OPENWRT/files" -name '__pycache__' -type d -print 2>/dev/null | wc -l)
          # *.pyc 只数 __pycache__ 之外的（目录内的跟着目录一起没了，别重复计数）
          n=$((n + $(find "$OPENWRT/files" -name '*.pyc' -type f -not -path '*/__pycache__/*' -print 2>/dev/null | wc -l)))
          if [ "$n" -gt 0 ]; then
            find "$OPENWRT/files" -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            find "$OPENWRT/files" -name '*.pyc' -type f -delete 2>/dev/null || true
            echo "已清掉 files/ 下 $n 项 python 缓存（__pycache__/*.pyc）"
          fi
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # ---- 诊断：本地包安装位置与符号注册情况 ----
        echo "==== 诊断 ===="
        echo "--- 本地包安装位置（nrlocal feed）---"
        ls -d package/feeds/nrlocal/*/ 2>/dev/null | head -5 || true
        echo "--- Kconfig 里是否注册了符号（0 = 没注册）---"
        for p in luci-app-wtmodem luci-app-cellscan fanctl ledctl; do
          n=$(grep -c "config PACKAGE_$p$" tmp/.config-package.in 2>/dev/null || true)
          echo "  $p: ${n:-0}"
        done
        echo "==== 诊断结束 ===="
        # 快速失败：确认本仓库自带的本地包真的被 defconfig 选中了。
        # 否则要等 2.5 小时才在编译末尾报“找不到包/依赖缺失”，代价太大。
        # 后半段是 fanctl/ledctl 的 DEPENDS：它们被选中就证明包内依赖声明真的生效了。
        missing=0
        for p in luci-app-wtmodem luci-app-cellscan luci-compat luci-lua-runtime luci-lib-nixio \
                 fanctl ledctl \
                 kmod-hwmon-pwmfan kmod-gpio-pwm kmod-leds-gpio kmod-ledtrig-network; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "  OK   CONFIG_PACKAGE_$p=y"
          else
            echo "::error::CONFIG_PACKAGE_$p 未被选中（本地包没拷进 package/？依赖缺失？）"
            grep -n "$p" .config | head -5 || true
            missing=1
          fi
        done
        [ "$missing" = 0 ] || exit 1
        grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        grep -q '^CONFIG_CCACHE=y' .config && echo "ccache enabled: $(ccache -s | head -3)"
        if make -j$(nproc) || make -j1 || make -j1 V=s; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "::error::编译失败，不会上传/发布产物"
          exit 1
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "device: NRadio C8 (WT9104 / C8-688), target: mediatek/filogic" >> release.txt
        echo "base: immortalwrt @ $BUILD_BRANCH" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      continue-on-error: true
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
